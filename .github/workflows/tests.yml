name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.26']
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Vendor Go
        run: go mod vendor
      - name: Format
        run: |
          go install mvdan.cc/gofumpt@v0.10.0
          out=$(gofumpt -l $(git ls-files '*.go' | xargs grep -L '^// Code generated'))
          if [ -n "$out" ]; then echo "needs gofumpt:"; echo "$out"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build Go
        run: go build -v ./...
